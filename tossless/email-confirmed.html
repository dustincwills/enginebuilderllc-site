<!doctype html>
<html lang="en" class="legal-page">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Confirmation that a TossLess account email address has been verified.">
    <meta name="theme-color" content="#24443a">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
    <title>Email link | TossLess</title>
    <link rel="stylesheet" href="../styles.css">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <a class="brand" href="../index.html" aria-label="Engine Builder LLC home">
        <span class="brand-mark" aria-hidden="true">E</span><span>Engine Builder LLC</span>
      </a>
      <nav aria-label="TossLess navigation"><a href="support.html">Support</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></nav>
    </header>

    <main id="main-content">
      <p class="section-label">TossLess</p>
      <h1 id="status-title">Checking email link</h1>
      <p id="status-message" role="status" aria-live="polite">Checking the result of your TossLess email link.</p>
      <p id="next-step"></p>
      <p>For help, visit <a href="support.html">TossLess Support</a>.</p>
    </main>

    <footer class="site-footer">
      <span>© <span id="year"></span> Engine Builder LLC. All rights reserved.</span>
      <div><a href="support.html">TossLess Support</a><a href="privacy.html">TossLess Privacy</a><a href="terms.html">TossLess Terms</a><a href="../index.html">Company</a></div>
    </footer>
    <script>
      const query = new URLSearchParams(window.location.search);
      const fragment = new URLSearchParams(window.location.hash.slice(1));
      const parameter = (name) => fragment.get(name) || query.get(name);
      const type = parameter('type');
      const hasError = Boolean(parameter('error') || parameter('error_code') || parameter('error_description'));
      const hasSession = Boolean(parameter('access_token') && parameter('refresh_token'));
      const title = document.getElementById('status-title');
      const message = document.getElementById('status-message');
      const nextStep = document.getElementById('next-step');

      // Auth errors and recovery links must never be presented as confirmed email.
      if (hasError) {
        title.textContent = 'Email link unavailable';
        message.textContent = 'This email link is invalid or has expired.';
        nextStep.textContent = 'Return to TossLess and request a new email.';
      } else if (type === 'recovery') {
        title.textContent = 'Password reset link opened here';
        message.textContent = 'This password-reset link opened the email confirmation page.';
        nextStep.textContent = 'Return to TossLess and request a new password-reset email from the app.';
      } else if ((type === 'signup' || type === 'email') && hasSession) {
        title.textContent = 'Email confirmed';
        message.textContent = 'Your TossLess email address has been confirmed.';
        nextStep.textContent = 'Return to TossLess and sign in with your household email address and password.';
      } else if (type === 'invite' && hasSession) {
        title.textContent = 'Invitation accepted';
        message.textContent = 'Your TossLess invitation link was accepted.';
        nextStep.textContent = 'Return to TossLess to continue setting up your account.';
      } else {
        title.textContent = 'Email link unavailable';
        message.textContent = 'This page cannot confirm an email address without a valid confirmation result.';
        nextStep.textContent = 'Return to TossLess and request a new confirmation email if needed.';
      }

      // Remove one-time Auth credentials and errors from browser history.
      history.replaceState(null, '', window.location.pathname);
      document.title = `${title.textContent} | TossLess`;
      document.getElementById('year').textContent = new Date().getFullYear();
    </script>
  </body>
</html>
